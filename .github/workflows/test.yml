name: Mono-Zenith Tests

on:
  push:
    branches:
      - mono-zenith-1.0
  pull_request:
    branches:
      - mono-zenith-1.0

jobs:
  kunit:
    name: KUnit Tests (UML/x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential flex bison \
            libssl-dev libelf-dev python3 python3-pip

      - name: Run KUnit via UML
        run: |
          ./tools/testing/kunit/kunit.py run \
            --arch=x86_64 \
            --jobs=$(nproc) \
            2>&1 | tee kunit-results.log
        continue-on-error: true

      - name: Parse KUnit results
        run: |
          if grep -q "FAILED" kunit-results.log; then
            echo "❌ KUnit tests failed"
            grep "FAILED" kunit-results.log
            exit 1
          else
            echo "✅ KUnit tests passed"
          fi

      - name: Upload KUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunit-results
          path: kunit-results.log

  qemu-boot-arm64:
    name: QEMU Boot Smoke Test [arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-system-arm dwarves pahole

      - name: Build ARM64 kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: QEMU boot smoke test
        run: |
          timeout 90 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a57 \
            -m 512M \
            -nographic \
            -kernel arch/arm64/boot/Image \
            -append "console=ttyAMA0 panic=1" \
            2>&1 | tee qemu-boot.log || true

          # A VFS rootfs panic is EXPECTED for a bare kernel with no initramfs.
          # We verify the kernel successfully completes early boot and subsystem
          # init — a real bug would panic long before reaching this stage.
          if grep -q "Booting Linux" qemu-boot.log && \
             grep -q "alternatives: applying system-wide alternatives" qemu-boot.log; then
            echo "✅ Kernel boot initialization succeeded"
            echo "ℹ️  VFS rootfs panic is expected without an initramfs"
          else
            echo "❌ Kernel failed to reach userspace init stage"
            echo "--- Boot log ---"
            cat qemu-boot.log
            exit 1
          fi

          # Fail only on early/unexpected panics (not the expected VFS one)
          if grep -v "VFS: Unable to mount root fs" qemu-boot.log | \
             grep -q "Kernel panic"; then
            echo "❌ Unexpected kernel panic detected"
            exit 1
          fi

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-log-arm64
          path: qemu-boot.log

  qemu-boot-x86:
    name: QEMU Boot Smoke Test [x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev \
            qemu-system-x86 dwarves pahole

      - name: Build x86_64 kernel
        run: |
          make ARCH=x86_64 x86_64_defconfig
          make ARCH=x86_64 -j$(nproc)

      - name: QEMU boot smoke test
        run: |
          timeout 90 qemu-system-x86_64 \
            -m 512M \
            -nographic \
            -kernel arch/x86/boot/bzImage \
            -append "console=ttyS0 panic=1" \
            2>&1 | tee qemu-boot-x86.log || true

          # Same logic as ARM64: VFS panic is expected without initramfs.
          # Check that the kernel completed early init successfully.
          if grep -q "Booting Linux" qemu-boot-x86.log && \
             grep -q "alternatives: applying system-wide alternatives" qemu-boot-x86.log; then
            echo "✅ Kernel boot initialization succeeded"
            echo "ℹ️  VFS rootfs panic is expected without an initramfs"
          else
            echo "❌ Kernel failed to reach userspace init stage"
            echo "--- Boot log ---"
            cat qemu-boot-x86.log
            exit 1
          fi

          # Fail only on unexpected panics (not the expected VFS one)
          if grep -v "VFS: Unable to mount root fs" qemu-boot-x86.log | \
             grep -q "Kernel panic"; then
            echo "❌ Unexpected kernel panic detected"
            exit 1
          fi

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-log-x86_64
          path: qemu-boot-x86.log

  patches-apply:
    name: Verify patches/ Apply Cleanly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Dry-run apply all patches
        run: |
          # Exit cleanly if patches/ doesn't exist yet
          if [ ! -d patches/ ]; then
            echo "ℹ️  No patches/ directory found — skipping"
            exit 0
          fi

          # Exit cleanly if no .patch files exist (uses nullglob to avoid literal glob)
          shopt -s nullglob
          patches=(patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "ℹ️  No .patch files in patches/ — skipping"
            exit 0
          fi

          echo "Found ${#patches[@]} patch(es):"
          printf '  %s\n' "${patches[@]}"
          echo ""

          FAILED=0
          for patch in "${patches[@]}"; do
            echo "Checking: $patch"
            if git apply --check "$patch" 2>&1; then
              echo "  ✅ Applies cleanly"
            else
              echo "  ❌ Does not apply: $patch"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ One or more patches failed to apply"
            exit 1
          fi

          echo ""
          echo "✅ All patches apply cleanly"