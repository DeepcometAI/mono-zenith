name: Mono-Zenith Tests

on:
  push:
    branches:
      - mono-zenith-1.0
  pull_request:
    branches:
      - mono-zenith-1.0

jobs:
  kunit:
    name: KUnit Tests (UML/x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential flex bison \
            libssl-dev libelf-dev python3 python3-pip

      - name: Run KUnit via UML
        run: |
          ./tools/testing/kunit/kunit.py run \
            --arch=x86_64 \
            --jobs=$(nproc) \
            2>&1 | tee kunit-results.log
        continue-on-error: true

      - name: Parse KUnit results
        run: |
          if grep -q "FAILED" kunit-results.log; then
            echo "❌ KUnit tests failed"
            grep "FAILED" kunit-results.log
            exit 1
          else
            echo "✅ KUnit tests passed"
          fi

      - name: Upload KUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunit-results
          path: kunit-results.log

  qemu-boot-arm64:
    name: QEMU Boot Smoke Test [arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-system-arm dwarves pahole

      - name: Build ARM64 kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: QEMU boot smoke test
        run: |
          # Use more SMP cores to speed up emulated boot on slow CI runners.
          # KVM is not available on GitHub Actions ARM runners so we use TCG.
          timeout 300 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a57 \
            -smp 2 \
            -m 512M \
            -nographic \
            -kernel arch/arm64/boot/Image \
            -append "console=ttyAMA0 panic=1" \
            2>&1 | tee qemu-boot.log || true

          # "VFS: Finished mounting rootfs on nullfs" is the reliable landmark —
          # it appears after all kernel subsystems init and just before the
          # rootfs mount attempt. The subsequent VFS panic is expected without
          # an initramfs and is NOT a kernel bug.
          if grep -q "VFS: Finished mounting rootfs on nullfs" qemu-boot.log; then
            echo "✅ Kernel init completed successfully"
            echo "ℹ️  VFS rootfs panic is expected without an initramfs"
          else
            echo "❌ Kernel did not reach VFS init stage within timeout"
            echo "Last 30 lines of boot log:"
            tail -30 qemu-boot.log
            exit 1
          fi

          # Catch any unexpected panics other than the known VFS rootfs one
          if grep -v "VFS: Unable to mount root fs" qemu-boot.log | \
             grep -q "Kernel panic"; then
            echo "❌ Unexpected kernel panic detected"
            exit 1
          fi

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-log-arm64
          path: qemu-boot.log

  qemu-boot-x86:
    name: QEMU Boot Smoke Test [x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev \
            qemu-system-x86 dwarves pahole

      - name: Build x86_64 kernel
        run: |
          make ARCH=x86_64 x86_64_defconfig
          make ARCH=x86_64 -j$(nproc)

      - name: Check KVM availability
        run: |
          if [ -e /dev/kvm ] && [ -r /dev/kvm ]; then
            echo "KVM_ARGS=-enable-kvm -cpu host" >> $GITHUB_ENV
            echo "ℹ️  KVM available — using hardware acceleration"
          else
            echo "KVM_ARGS=-cpu qemu64" >> $GITHUB_ENV
            echo "ℹ️  KVM not available — using TCG (software emulation)"
          fi

      - name: QEMU boot smoke test
        run: |
          # 300s timeout: TCG software emulation on CI runners is slow.
          # With KVM this completes in ~5s; without it, up to ~3 minutes.
          timeout 300 qemu-system-x86_64 \
            $KVM_ARGS \
            -smp 2 \
            -m 512M \
            -nographic \
            -kernel arch/x86/boot/bzImage \
            -append "console=ttyS0 panic=1 nokaslr" \
            2>&1 | tee qemu-boot-x86.log || true

          # "VFS: Finished mounting rootfs on nullfs" is the correct landmark
          # for a bare kernel smoke test. It confirms all subsystems initialised
          # successfully. The VFS rootfs panic that follows is expected and
          # normal — there is no initramfs or root device provided.
          if grep -q "VFS: Finished mounting rootfs on nullfs" qemu-boot-x86.log; then
            echo "✅ Kernel init completed successfully"
            echo "ℹ️  VFS rootfs panic is expected without an initramfs"
          else
            echo "❌ Kernel did not reach VFS init stage within timeout"
            echo "Last 30 lines of boot log:"
            tail -30 qemu-boot-x86.log
            exit 1
          fi

          # Catch unexpected panics — anything other than the known VFS one
          if grep -v "VFS: Unable to mount root fs" qemu-boot-x86.log | \
             grep -q "Kernel panic"; then
            echo "❌ Unexpected kernel panic detected"
            exit 1
          fi

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-log-x86_64
          path: qemu-boot-x86.log

  patches-apply:
    name: Verify patches/ Apply Cleanly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Dry-run apply all patches
        run: |
          # Exit cleanly if patches/ doesn't exist yet
          if [ ! -d patches/ ]; then
            echo "ℹ️  No patches/ directory found — skipping"
            exit 0
          fi

          # Exit cleanly if no .patch files exist (uses nullglob to avoid literal glob)
          shopt -s nullglob
          patches=(patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "ℹ️  No .patch files in patches/ — skipping"
            exit 0
          fi

          echo "Found ${#patches[@]} patch(es):"
          printf '  %s\n' "${patches[@]}"
          echo ""

          FAILED=0
          for patch in "${patches[@]}"; do
            echo "Checking: $patch"
            if git apply --check "$patch" 2>&1; then
              echo "  ✅ Applies cleanly"
            else
              echo "  ❌ Does not apply: $patch"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ One or more patches failed to apply"
            exit 1
          fi

          echo ""
          echo "✅ All patches apply cleanly"