name: Mono-Zenith Security Scans

on:
  push:
    branches:
      - mono-zenith-1.0
  pull_request:
    branches:
      - mono-zenith-1.0
  schedule:
    # Run weekly on Monday at 02:00 UTC
    - cron: "0 2 * * 1"

jobs:
  cve-check:
    name: CVE / Security Backport Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip curl jq

      - name: Check docs/security.md exists
        run: |
          if [ ! -f docs/security.md ]; then
            echo "⚠️  docs/security.md not found."
            echo "   Create it to document security backports and CVE references."
          else
            echo "✅ docs/security.md present"
            cat docs/security.md
          fi

      - name: Check kernel version for known CVE advisories
        run: |
          KERNEL_VERSION=$(make kernelversion 2>/dev/null || \
            awk '/^VERSION|^PATCHLEVEL|^SUBLEVEL/{print $3}' Makefile | \
            head -3 | paste -sd'.')
          echo "Kernel base version: $KERNEL_VERSION"
          echo "ℹ️  Cross-reference $KERNEL_VERSION against https://www.linuxkernelcves.com/"

  codeql:
    name: CodeQL Analysis [C]
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Check for scannable C source
        id: check-src
        run: |
          # CodeQL C analyzer requires at least one .c file to build its
          # database — it exits with code 32 if given nothing to compile.
          # Skip the scan entirely until patches/ contains C source files.
          if find patches/ -name "*.c" 2>/dev/null | grep -q .; then
            COUNT=$(find patches/ -name "*.c" | wc -l)
            echo "✅ Found $COUNT C file(s) in patches/ — proceeding with CodeQL"
            echo "has_source=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  No C source files in patches/ yet — skipping CodeQL"
            echo "ℹ️  CodeQL will run automatically once .c files are added to patches/"
            echo "has_source=false" >> $GITHUB_OUTPUT
          fi

      - name: Initialize CodeQL
        if: steps.check-src.outputs.has_source == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: c
          # build-mode: none — source-only analysis, no compilation required.
          # Avoids the "no source code seen during build" error (exit code 32)
          # that occurs when CodeQL's C database finalizer finds zero compiled files.
          build-mode: none
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: steps.check-src.outputs.has_source == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c"
          upload: true

  dependency-review:
    name: Dependency Review (PRs)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical