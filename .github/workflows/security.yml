name: Mono-Zenith Security Scans

on:
  push:
    branches:
      - mono-zenith-1.0
  pull_request:
    branches:
      - mono-zenith-1.0
  schedule:
    # Run weekly on Monday at 02:00 UTC
    - cron: "0 2 * * 1"

jobs:
  cve-check:
    name: CVE / Security Backport Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip curl jq

      - name: Check docs/security.md exists
        run: |
          if [ ! -f docs/security.md ]; then
            echo "⚠️  docs/security.md not found."
            echo "   Create it to document security backports and CVE references."
          else
            echo "✅ docs/security.md present"
            cat docs/security.md
          fi

      - name: Check kernel version for known CVE advisories
        run: |
          KERNEL_VERSION=$(make kernelversion 2>/dev/null || \
            awk '/^VERSION|^PATCHLEVEL|^SUBLEVEL/{print $3}' Makefile | \
            head -3 | paste -sd'.')
          echo "Kernel base version: $KERNEL_VERSION"
          echo "ℹ️  Cross-reference $KERNEL_VERSION against https://www.linuxkernelcves.com/"

  codeql:
    name: CodeQL Analysis [C]
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c
          # security-extended fires on every kernel sprintf/strcpy — all false
          # positives. security-and-quality is scoped enough to be meaningful
          # on the patches Mono-Zenith actually owns.
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev

      - name: Build for CodeQL analysis
        run: |
          make ARCH=x86_64 x86_64_defconfig
          make ARCH=x86_64 -j$(nproc) 2>/dev/null || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c"
          # Always upload results — findings are reviewed in the Security tab,
          # not treated as CI gate failures, since kernel builds can't be
          # cleanly gated on CodeQL without tuning per-subsystem.
          upload: true

  dependency-review:
    name: Dependency Review (PRs)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical