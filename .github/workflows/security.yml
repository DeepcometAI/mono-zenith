name: Mono-Zenith Security Scans

on:
  push:
    branches:
      - mono-zenith-1.0
  pull_request:
    branches:
      - mono-zenith-1.0
  schedule:
    # Run weekly on Monday at 02:00 UTC
    - cron: "0 2 * * 1"

jobs:
  cve-check:
    name: CVE / Security Backport Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip curl jq

      - name: Check docs/security.md exists
        run: |
          if [ ! -f docs/security.md ]; then
            echo "⚠️  docs/security.md not found."
            echo "   Create it to document security backports and CVE references."
          else
            echo "✅ docs/security.md present"
            cat docs/security.md
          fi

      - name: Check kernel version for known CVE advisories
        run: |
          KERNEL_VERSION=$(make kernelversion 2>/dev/null || \
            awk '/^VERSION|^PATCHLEVEL|^SUBLEVEL/{print $3}' Makefile | \
            head -3 | paste -sd'.')
          echo "Kernel base version: $KERNEL_VERSION"
          echo "ℹ️  Cross-reference $KERNEL_VERSION against https://www.linuxkernelcves.com/"

  codeql:
    name: CodeQL Analysis [C]
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mono-zenith-1.0
          fetch-depth: 1

      # Write the CodeQL config inline so no extra file is needed in the repo.
      # Scopes scanning to Mono-Zenith-owned paths only (patches/, docs/) and
      # excludes every upstream kernel subsystem directory to eliminate the 267
      # false positives from CodeQL running security-extended against Linus's tree.
      - name: Write CodeQL config
        run: |
          mkdir -p .github/codeql
          cat > .github/codeql/codeql-config.yml << 'CODEQL_EOF'
          name: Mono-Zenith CodeQL Config

          # Only scan code added by Mono-Zenith — not the upstream kernel tree.
          # If patches/ or docs/ don't exist yet, CodeQL will find nothing and
          # exit cleanly rather than scanning the entire kernel source.
          paths:
            - patches/
            - docs/

          # Exclude all upstream Linux subsystem directories.
          # These contain intentional kernel idioms that look like bugs to
          # CodeQL's userspace-oriented queries (sprintf, strcpy with computed
          # bounds, fixed-size proc buffers, MPI bignum patterns, etc.).
          paths-ignore:
            - arch/
            - block/
            - crypto/
            - drivers/
            - fs/
            - include/
            - init/
            - ipc/
            - kernel/
            - lib/
            - mm/
            - net/
            - scripts/
            - security/
            - sound/
            - tools/
            - usr/
            - virt/

          query-filters:
            # These query IDs fired on upstream code and are all false positives
            # in a kernel context. Exclude them even if paths shift later.
            - exclude:
                id: cpp/unbounded-write
            - exclude:
                id: cpp/potentially-dangerous-function
            - exclude:
                id: cpp/use-of-expired-stack-address
            - exclude:
                id: cpp/overrunning-write
            - exclude:
                id: cpp/invalid-pointer-dereference
          CODEQL_EOF
          echo "✅ CodeQL config written"
          cat .github/codeql/codeql-config.yml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c
          # security-extended fires on every kernel sprintf/strcpy — all false
          # positives. security-and-quality is scoped enough to be meaningful
          # on the patches Mono-Zenith actually owns.
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev

      - name: Build for CodeQL analysis
        run: |
          make ARCH=x86_64 x86_64_defconfig
          make ARCH=x86_64 -j$(nproc) 2>/dev/null || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c"
          # Always upload results — findings are reviewed in the Security tab,
          # not treated as CI gate failures, since kernel builds can't be
          # cleanly gated on CodeQL without tuning per-subsystem.
          upload: true

  dependency-review:
    name: Dependency Review (PRs)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical